<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notion Manga Viewer</title>
<style>
    /* 전체 화면 여백 제거 및 배경 설정 (노션 임베드 시 꽉 차게) */
    body {
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        height: 100vh;
        background-color: #ffffff;
        font-family: 'Malgun Gothic', sans-serif;
        user-select: none; /* 연속 클릭 시 텍스트 드래그 방지 */
        overflow: hidden; /* 브라우저 전체 스크롤 방지 */
    }
        
    /* 전체 컨테이너 */
    .viewer-wrapper {
        width: 100%;
        max-width: 800px; /* 뷰어 최대 너비 */
        height: 100%;
        min-height: 0; /* 컨테이너 팽창 방지 */
        display: flex;
        flex-direction: column;
        position: relative; /* 하단 UI 겹치기를 위한 기준점 설정 */
    }
        
    /* 뷰어 영역 (이미지 전체 목록이 스크롤 되는 곳) */
    .viewer {
        flex-grow: 1; /* 남은 공간을 모두 차지 */
        min-height: 0; /* 내부 이미지 높이로 인한 영역 무한 확장 방지 */
        overflow-y: auto;
        overflow-x: auto; /* 확대 시 가로 스크롤 허용 */
        background-color: #1a1a1a; /* 만화 몰입도를 위한 어두운 배경 */
        position: relative;
        
        /* 스크롤바 숨기기 */
        -ms-overflow-style: none; /* IE, Edge */
        scrollbar-width: none; /* Firefox */
    }
    
    .viewer::-webkit-scrollbar {
        display: none; /* Chrome, Safari, Opera */
    }
    /* 전체 이미지를 감싸는 컨테이너 (일괄 확대용) */
    .manga-container {
        width: calc(100% * var(--zoom-scale, 1)); /* 전체 일괄 확대 적용 */
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-bottom: 100vh; /* 하단 스크롤 여백 */
    }
        
    /* 만화 페이지 크기 및 비율 설정 */
    .manga-page {
        width: 100%;
        flex-shrink: 0; /* 비율 왜곡 방지 */
        aspect-ratio: 1 / 1.414; /* 점프 만화 원고(B4) 비율 */
        display: flex;
        justify-content: center;
        align-items: center;
        border-bottom: 2px solid #000;
        box-sizing: border-box;
        margin-bottom: 20px; /* 이미지 사이 간격 */
    }
    /* 마지막 이미지 아래 간격 처리 */
    .manga-page:last-child {
        margin-bottom: 0;
    }
        
    /* 실제 만화 이미지 스타일 */
    .manga-page img {
        width: 100%;
        height: 100%;
        object-fit: contain; /* 이미지가 잘리지 않고 비율 유지 */
        background-color: #fff;
    }
    
    /* 하단 UI들을 묶어서 뷰어 위에 띄우는 컨테이너 */
    .bottom-ui {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        z-index: 10;
    }

    /* 초록색 게이지 바 */
    #progressBar {
        position: absolute;
        top: 0;
        left: 0;
        height: 2px; /* 아주 가는 굵기 */
        background-color: #22c55e; /* 초록색 */
        width: 0%;
        z-index: 20;
        transition: width 0.15s ease-out;
    }

    /* 이동 단위 선택 바 */
    .mode-selector {
        width: 100%;
        padding: 6px 15px;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #e4e4e7;
        border-top: 1px solid #d4d4d8;
        font-size: 12px;
        color: #3f3f46;
        box-sizing: border-box;
        position: relative; /* 내부 absolute 배치를 위한 기준 */
    }

    /* 번호 표시기 (왼쪽에 고정) */
    #step-indicator {
        position: absolute;
        left: 15px;
        font-weight: bold;
        font-size: 14px;
        color: #27272a;
    }

    /* 라디오 버튼을 묶어 가운데 정렬 유지 */
    .radio-group {
        display: flex;
        gap: 20px;
    }

    .mode-selector label {
        display: flex;
        align-items: center;
        gap: 4px;
        cursor: pointer;
        font-weight: 600;
    }
    .mode-selector input[type="radio"] {
        cursor: pointer;
        accent-color: #27272a;
        margin: 0;
    }
        
    /* 뷰어 밖 하단 컨트롤 영역 */
    .controls {
        width: 100%;
        padding: 10px 15px; 
        display: flex;
        flex-direction: row; 
        justify-content: center;
        align-items: center;
        gap: 10px; 
        background-color: #f4f4f5;
        border-top: 1px solid #e4e4e7;
        box-sizing: border-box;
    }
        
    /* 좌/우 50% 크기의 표시 영역 */
    .controls .btn-img {
        flex: 1; 
        padding: 12px 0;
        font-size: 22px;
        font-weight: bold;
        color: #fff;
        background-color: #27272a;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        text-align: center;
        box-sizing: border-box;
        cursor: default; /* 클릭 안되는 느낌을 위해 포인터 제거 */
    }
</style>
</head>
<body>
        
<div class="viewer-wrapper">
    <!-- 만화 뷰어 영역 -->
    <div class="viewer" id="mangaViewer">
        <div class="manga-container" id="mangaContainer">
            <div class="manga-page">
                <img src="1.png" alt="페이지 1">
            </div>
            <div class="manga-page">
                <img src="2.png" alt="페이지 2">
            </div>
            <div class="manga-page">
                <img src="3.png" alt="페이지 3">
            </div>
        </div>
    </div>
    
    <!-- 하단 컨트롤 UI -->
    <div class="bottom-ui">
        <!-- 초록색 진행률 바 -->
        <div id="progressBar"></div>
        <div class="mode-selector">
            <!-- 왼쪽 현재 번호 / 전체 번호 표시 -->
            <div id="step-indicator">0 / 0</div>
            <div class="radio-group">
                <label><input type="radio" name="scrollStep" value="2"> 1/2 단위</label>
                <label><input type="radio" name="scrollStep" value="3" checked> 1/3 단위</label>
            </div>
        </div>
        <div class="controls">
            <div class="btn-img">∧</div>
            <div class="btn-img">∨</div>
        </div>
    </div>
</div>
        
<script>
    let currentAlign = 'right'; 
    const ALIGN_OFFSET = 35; // 화면 정렬 시 살짝 아래로 내려 읽기 편하게 해주는 여백(px)

    function scrollManga(direction) {
        const viewer = document.getElementById('mangaViewer');
        const pages = viewer.querySelectorAll('.manga-page');
        
        const selectedMode = document.querySelector('input[name="scrollStep"]:checked')?.value || '3';
        const steps = parseInt(selectedMode, 10);
        const targetScrolls = [];
        
        pages.forEach((page) => {
            const pTop = page.offsetTop;
            const pHeight = page.offsetHeight;
            
            for (let i = 0; i < steps; i++) {
                // 오프셋을 빼서 목표 스크롤을 살짝 위로 잡아, 내용이 화면에서 살짝 아래로 내려오게 함
                targetScrolls.push(Math.max(0, pTop + (pHeight * (i / steps)) - ALIGN_OFFSET));
            }
        });
        
        const currentScroll = viewer.scrollTop;
        let closestIndex = 0;
        let minDiff = Infinity;
        targetScrolls.forEach((target, index) => {
            const diff = Math.abs(target - currentScroll);
            if (diff < minDiff) {
                minDiff = diff;
                closestIndex = index;
            }
        });

        let targetIndex = closestIndex;
        let targetX = viewer.scrollLeft;

        if (zoomScale > 1) {
            const maxScrollX = viewer.scrollWidth - viewer.clientWidth;
            
            if (direction === 1) { 
                if (currentAlign === 'right') {
                    currentAlign = 'left';
                    targetX = 0; 
                } else {
                    currentAlign = 'right';
                    targetX = maxScrollX; 
                    targetIndex = Math.max(0, Math.min(closestIndex + 1, targetScrolls.length - 1)); 
                }
            } else { 
                if (currentAlign === 'left') {
                    currentAlign = 'right';
                    targetX = maxScrollX; 
                } else {
                    currentAlign = 'left';
                    targetX = 0; 
                    targetIndex = Math.max(0, Math.min(closestIndex - 1, targetScrolls.length - 1)); 
                }
            }
        } else {
            targetIndex = Math.max(0, Math.min(closestIndex + direction, targetScrolls.length - 1));
            targetX = (viewer.scrollWidth - viewer.clientWidth) / 2; 
        }

        viewer.scrollTo({ top: targetScrolls[targetIndex], left: targetX, behavior: 'smooth' });
    }
    
    const viewer = document.getElementById('mangaViewer');
    let zoomScale = 1;
    let startDist = 0;
    let initialZoomScale = 1;
    let isPinching = false;
    
    function applyZoom(scale) {
        zoomScale = Math.min(Math.max(1, scale), 3);
        viewer.style.setProperty('--zoom-scale', zoomScale);
        updateZoneIndicator();
    }
    
    viewer.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
            isPinching = true;
            startDist = Math.hypot(
                e.touches[0].clientX - e.touches[1].clientX,
                e.touches[0].clientY - e.touches[1].clientY
            );
            initialZoomScale = zoomScale;
        }
    }, { passive: false });
    
    viewer.addEventListener('touchmove', (e) => {
        if (e.touches.length === 2 && startDist > 0) {
            isPinching = true;
            if (e.cancelable) e.preventDefault(); 
            const currentDist = Math.hypot(
                e.touches[0].clientX - e.touches[1].clientX,
                e.touches[0].clientY - e.touches[1].clientY
            );
            applyZoom(initialZoomScale * (currentDist / startDist));
        }
    }, { passive: false });
    
    viewer.addEventListener('touchend', (e) => {
        if (e.touches.length < 2) {
            setTimeout(() => { isPinching = false; }, 300);
        }
    });
    
    window.addEventListener('click', (e) => {
        if (e.target.closest('.controls') || e.target.closest('.mode-selector') || isPinching) {
            return;
        }
        
        const isRightHalf = e.clientX > window.innerWidth / 2;
        const isBottomHalf = e.clientY > window.innerHeight / 2;
        
        if (isRightHalf && isBottomHalf) {
            scrollManga(1); 
        } else {
            scrollManga(-1);
        }
    });
    
    window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
            e.preventDefault();
            scrollManga(1);
        } else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
            e.preventDefault();
            scrollManga(-1);
        }
    });

    // ----------------------------------------------------
    // 실시간 상태 업데이트 로직 (게이지 바 & 번호)
    // ----------------------------------------------------
    function updateZoneIndicator() {
        const pages = viewer.querySelectorAll('.manga-page');
        const selectedMode = document.querySelector('input[name="scrollStep"]:checked')?.value || '3';
        const steps = parseInt(selectedMode, 10);
        
        const targetScrolls = [];
        pages.forEach((page) => {
            const pTop = page.offsetTop;
            const pHeight = page.offsetHeight;
            for (let i = 0; i < steps; i++) {
                targetScrolls.push(Math.max(0, pTop + (pHeight * (i / steps)) - ALIGN_OFFSET));
            }
        });
        
        let closestIndex = 0;
        let minDiff = Infinity;
        targetScrolls.forEach((target, index) => {
            const diff = Math.abs(target - viewer.scrollTop);
            if (diff < minDiff) {
                minDiff = diff;
                closestIndex = index;
            }
        });

        const indicator = document.getElementById('step-indicator');
        const progressBar = document.getElementById('progressBar');

        let currentStepNum = 0;
        let totalStepsNum = targetScrolls.length;

        // 확대 상태일 때는 좌/우 이동까지 포함하여 전체 단계를 2배로 계산
        if (zoomScale > 1) {
            totalStepsNum = targetScrolls.length * 2;
            const maxScrollX = viewer.scrollWidth - viewer.clientWidth;
            const isRight = viewer.scrollLeft >= (maxScrollX / 2) - 10;
            currentStepNum = (closestIndex * 2) + (isRight ? 1 : 2);
        } else {
            currentStepNum = closestIndex + 1;
        }

        // 텍스트(번호만) 및 게이지 바 업데이트
        indicator.innerText = `${currentStepNum} / ${totalStepsNum}`;
        progressBar.style.width = `${(currentStepNum / totalStepsNum) * 100}%`;
    }

    viewer.addEventListener('scroll', updateZoneIndicator, { passive: true });
    window.addEventListener('resize', updateZoneIndicator);
    document.querySelectorAll('input[name="scrollStep"]').forEach(el => {
        el.addEventListener('change', updateZoneIndicator);
    });

    setTimeout(updateZoneIndicator, 50);
</script>
        
</body>
</html>
