<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notion Manga Viewer</title>
<style>
    /* 전체 화면 여백 제거 및 배경 설정 (노션 임베드 시 꽉 차게) */
    body {
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        height: 100vh;
        background-color: #ffffff;
        font-family: 'Malgun Gothic', sans-serif;
        user-select: none; /* 연속 클릭 시 텍스트 드래그 방지 */
    }
      
    /* 전체 컨테이너 */
    .viewer-wrapper {
        width: 100%;
        max-width: 800px; /* 뷰어 최대 너비 */
        height: 100%;
        display: flex;
        flex-direction: column;
    }
      
    /* 뷰어 영역 (이미지가 스크롤 되는 곳) */
    .viewer {
        flex-grow: 1; /* 남은 공간을 모두 차지 */
        overflow-y: auto;
        background-color: #1a1a1a; /* 만화 몰입도를 위한 어두운 배경 */
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        
        /* 스크롤바 숨기기 */
        -ms-overflow-style: none; /* IE, Edge */
        scrollbar-width: none; /* Firefox */
    }
    
    .viewer::-webkit-scrollbar {
        display: none; /* Chrome, Safari, Opera */
    }
      
    /* 만화 페이지 크기 및 비율 설정 */
    .manga-page {
        width: 100%;
        max-height: 100%; /* 세로면이 뷰어를 초과하지 않도록 자동 축소 */
        flex-shrink: 0;   /* 비율 왜곡 방지 */
        aspect-ratio: 1 / 1.414; /* 점프 만화 원고(B4) 비율 */
        display: flex;
        justify-content: center;
        align-items: center;
        border-bottom: 2px solid #000;
        box-sizing: border-box;

        /* ★★★ [이미지 사이 간격 조절 위치] ★★★ */
        /* 아래 20px 숫자를 원하시는 크기로 변경하세요 (예: 10px, 30px, 50px 등) */
        margin-bottom: 20px;
    }

    /* 마지막 이미지 아래에는 여백이 남지 않도록 처리 */
    .manga-page:last-child {
        margin-bottom: 0;
    }
      
    /* 실제 만화 이미지 스타일 */
    .manga-page img {
        width: 100%;
        height: 100%;
        object-fit: contain; /* 이미지가 잘리지 않고 비율 유지 */
        background-color: #fff;
    }
      
    /* 뷰어 밖 하단 컨트롤 영역 (가로 2분할 구조) */
    .controls {
        width: 100%;
        padding: 10px 15px; 
        display: flex;
        flex-direction: row; /* 좌/우 가로 배치 */
        justify-content: center;
        align-items: center;
        gap: 10px; 
        background-color: #f4f4f5;
        border-top: 1px solid #e4e4e7;
        box-sizing: border-box;
    }
      
    /* 좌/우 50% 크기의 표시 영역 */
    .controls .btn-img {
        flex: 1; /* 좌우 1:1 동일 비율 배치 */
        padding: 12px 0;
        font-size: 22px;
        font-weight: bold;
        color: #fff;
        background-color: #27272a;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        text-align: center;
        box-sizing: border-box;
    }
</style>
</head>
<body>
      
<div class="viewer-wrapper">
    <!-- 만화 뷰어 영역 -->
    <div class="viewer" id="mangaViewer">
        <div class="manga-page">
            <img src="1.png" alt="페이지 1">
        </div>
        <div class="manga-page">
            <img src="2.png" alt="페이지 2">
        </div>
        <div class="manga-page">
            <img src="3.png" alt="페이지 3">
        </div>
    </div>
    
    <!-- 스케치 모양의 하단 가로 배치 컨트롤 표시 영역 -->
    <div class="controls">
        <div class="btn-img">∧</div>
        <div class="btn-img">∨</div>
    </div>
</div>
      
<script>
    function scrollManga(direction) {
        const viewer = document.getElementById('mangaViewer');
        const pages = viewer.querySelectorAll('.manga-page');
        const halfViewerHeight = viewer.clientHeight / 2;
     
        // 각 페이지의 상단 1/2, 하단 1/2 지점이 뷰어 중앙에 오도록 하는 스크롤 위치 산출
        const targetScrolls = [];
        pages.forEach((page) => {
            const topHalfCenter = page.offsetTop + page.offsetHeight * 0.25;
            const bottomHalfCenter = page.offsetTop + page.offsetHeight * 0.75;
     
            targetScrolls.push(Math.max(0, topHalfCenter - halfViewerHeight));
            targetScrolls.push(Math.max(0, bottomHalfCenter - halfViewerHeight));
        });
     
        // 현재 스크롤 위치와 가장 가까운 지점 찾기
        const currentScroll = viewer.scrollTop;
        let closestIndex = 0;
        let minDiff = Infinity;
     
        targetScrolls.forEach((target, index) => {
            const diff = Math.abs(target - currentScroll);
            if (diff < minDiff) {
                minDiff = diff;
                closestIndex = index;
            }
        });
     
        // direction(-1: 이전 반쪽, 1: 다음 반쪽)을 적용해 대상 선택
        const targetIndex = Math.max(0, Math.min(closestIndex + direction, targetScrolls.length - 1));
     
        // 목표 위치로 부드럽게 스크롤
        viewer.scrollTo({ top: targetScrolls[targetIndex], behavior: 'smooth' });
    }
     
    // 화면 터치/클릭 위치 판별 (우측 하단 1/4 = 다음, 그 외 = 이전)
    window.addEventListener('click', (e) => {
        if (e.target.closest('.controls')) {
            return;
        }
     
        const isRightHalf = e.clientX > window.innerWidth / 2;
        const isBottomHalf = e.clientY > window.innerHeight / 2;
     
        if (isRightHalf && isBottomHalf) {
            scrollManga(1);  // 우측 하단 1/4: 다음 (아래로)
        } else {
            scrollManga(-1); // 그 외 전체 영역: 이전 (위로)
        }
    });

    // 방향키(상/하/좌/우) 입력 처리
    window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
            e.preventDefault();
            scrollManga(1);
        } else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
            e.preventDefault();
            scrollManga(-1);
        }
    });
</script>
      
</body>
</html>
