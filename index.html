<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notion Manga Viewer</title>
<style>
    /* 전체 화면 여백 제거 및 배경 설정 */
    body {
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        height: 100vh;
        background-color: #ffffff;
        font-family: 'Malgun Gothic', sans-serif;
        user-select: none; /* 텍스트 드래그 방지 */
    }
        
    /* 전체 컨테이너 */
    .viewer-wrapper {
        width: 100%;
        max-width: 800px;
        height: 100vh;
        display: flex;
        flex-direction: column;
    }
        
    /* 뷰어 영역 (수동 스크롤 제거) */
    .viewer {
        flex: 1;
        overflow: hidden; /* 수동 스크롤바 및 자유 스크롤 완전 제거 */
        background-color: #1a1a1a;
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-bottom: 100vh; /* 하단 위치 정렬 여백 */
    }
        
    /* 만화 페이지 크기 및 비율 설정 */
    .manga-page {
        width: 100%;
        flex-shrink: 0;
        aspect-ratio: 1 / 1.414; /* 점프 만화 원고 비율 */
        display: flex;
        justify-content: center;
        align-items: center;
        border-bottom: 2px solid #000;
        box-sizing: border-box;
        margin-bottom: 20px;
    }

    .manga-page:last-child {
        margin-bottom: 0;
    }
        
    /* 만화 이미지 스타일 */
    .manga-page img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        background-color: #fff;
    }

    /* 이동 단위 선택 바 (항상 고정 표시) */
    .mode-selector {
        flex-shrink: 0;
        width: 100%;
        padding: 6px 0;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 20px;
        background-color: #e4e4e7;
        border-top: 1px solid #d4d4d8;
        font-size: 12px;
        color: #3f3f46;
        box-sizing: border-box;
    }

    .mode-selector label {
        display: flex;
        align-items: center;
        gap: 4px;
        cursor: pointer;
        font-weight: 600;
    }

    .mode-selector input[type="radio"] {
        cursor: pointer;
        accent-color: #27272a;
        margin: 0;
    }
        
    /* 하단 컨트롤 영역 (항상 고정 표시) */
    .controls {
        flex-shrink: 0;
        width: 100%;
        padding: 10px 15px; 
        display: flex;
        flex-direction: row;
        justify-content: center;
        align-items: center;
        gap: 10px; 
        background-color: #f4f4f5;
        border-top: 1px solid #e4e4e7;
        box-sizing: border-box;
    }
        
    .controls .btn-img {
        flex: 1;
        padding: 12px 0;
        font-size: 22px;
        font-weight: bold;
        color: #fff;
        background-color: #27272a;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        text-align: center;
        box-sizing: border-box;
    }
</style>
</head>
<body>
        
<div class="viewer-wrapper">
    <!-- 만화 뷰어 영역 -->
    <div class="viewer" id="mangaViewer">
        <div class="manga-page">
            <img src="1.png" alt="페이지 1">
        </div>
        <div class="manga-page">
            <img src="2.png" alt="페이지 2">
        </div>
        <div class="manga-page">
            <img src="3.png" alt="페이지 3">
        </div>
    </div>
    
    <!-- 이동 단위 선택 바 -->
    <div class="mode-selector">
        <label><input type="radio" name="scrollStep" value="2"> 1/2 단위</label>
        <label><input type="radio" name="scrollStep" value="3" checked> 1/3 단위</label>
    </div>

    <!-- 하단 컨트롤 버튼 -->
    <div class="controls">
        <div class="btn-img">∧</div>
        <div class="btn-img">∨</div>
    </div>
</div>
        
<script>
    function scrollManga(direction) {
        const viewer = document.getElementById('mangaViewer');
        const pages = viewer.querySelectorAll('.manga-page');
        
        const selectedMode = document.querySelector('input[name="scrollStep"]:checked')?.value || '3';
        const steps = parseInt(selectedMode, 10);

        const targetScrolls = [];
        pages.forEach((page) => {
            const pTop = page.offsetTop;
            const pHeight = page.offsetHeight;
            
            for (let i = 0; i < steps; i++) {
                targetScrolls.push(pTop + (pHeight * (i / steps)));
            }
        });

        const currentScroll = viewer.scrollTop;
        let closestIndex = 0;
        let minDiff = Infinity;

        targetScrolls.forEach((target, index) => {
            const diff = Math.abs(target - currentScroll);
            if (diff < minDiff) {
                minDiff = diff;
                closestIndex = index;
            }
        });

        const targetIndex = Math.max(0, Math.min(closestIndex + direction, targetScrolls.length - 1));
        viewer.scrollTo({ top: targetScrolls[targetIndex], behavior: 'smooth' });
    }
     
    // 마우스 휠 조작 시 임의 스크롤 방지 및 정해진 단위로만 이동
    let isWheelActive = false;
    window.addEventListener('wheel', (e) => {
        e.preventDefault();
        if (isWheelActive) return;

        if (e.deltaY > 0) {
            scrollManga(1);
        } else if (e.deltaY < 0) {
            scrollManga(-1);
        }

        isWheelActive = true;
        setTimeout(() => { isWheelActive = false; }, 250);
    }, { passive: false });

    // 화면 터치/클릭 영역 처리
    window.addEventListener('click', (e) => {
        if (e.target.closest('.controls') || e.target.closest('.mode-selector')) {
            return;
        }
     
        const isRightHalf = e.clientX > window.innerWidth / 2;
        const isBottomHalf = e.clientY > window.innerHeight / 2;
     
        if (isRightHalf && isBottomHalf) {
            scrollManga(1);
        } else {
            scrollManga(-1);
        }
    });

    // 방향키 조작 처리
    window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
            e.preventDefault();
            scrollManga(1);
        } else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
            e.preventDefault();
            scrollManga(-1);
        }
    });
</script>
        
</body>
</html>
