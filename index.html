<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notion Manga Viewer</title>
<style>
    /* 전체 화면 여백 제거 및 Flex 레이아웃 설정 */
    body {
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column; /* 위(뷰어) 아래(UI)로 분리 */
        height: 100vh; /* 노션 임베드 높이에 꽉 맞춤 */
        background-color: #1a1a1a;
        font-family: 'Malgun Gothic', sans-serif;
        user-select: none; 
        overflow: hidden; /* 브라우저 전체 스크롤 방지 */
    }
        
    /* 만화 뷰어 영역 (이미지가 스크롤 되는 곳) */
    .viewer {
        flex: 1; /* 남은 화면 공간을 모두 차지함 (핵심) */
        width: 100%;
        overflow-y: auto; /* 이 영역 안에서만 스크롤 발생 */
        display: flex;
        flex-direction: column;
        align-items: center;
        background-color: #1a1a1a;
        padding-bottom: 50vh; /* 마지막 장 스크롤 여유 공간 */
        
        /* 스크롤바 숨기기 */
        -ms-overflow-style: none; /* IE, Edge */
        scrollbar-width: none; /* Firefox */
    }
    
    .viewer::-webkit-scrollbar {
        display: none; /* Chrome, Safari, Opera */
    }
        
    /* 만화 페이지 크기 설정 */
    .manga-page {
        width: 100%; /* 제한 없이 화면 너비에 맞춤 */
        display: flex;
        justify-content: center;
        border-bottom: 2px solid #000;
        box-sizing: border-box;
        margin-bottom: 20px;
    }

    .manga-page:last-child {
        margin-bottom: 0;
    }
        
    /* 실제 만화 이미지 스타일 */
    .manga-page img {
        width: 100%; /* 컨테이너 너비에 100% 맞춤 */
        height: auto; /* 비율 깨짐 방지 */
        display: block;
        background-color: #fff;
    }

    /* 하단 컨트롤 UI (항상 바닥에 고정, 뷰어 밖 영역) */
    .bottom-ui {
        flex-shrink: 0; /* 화면이 작아져도 UI 공간은 축소되지 않음 */
        width: 100%;
        display: flex;
        flex-direction: column;
        z-index: 10;
    }

    /* 이동 단위 선택 바 */
    .mode-selector {
        width: 100%;
        padding: 8px 0;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 20px;
        background-color: #e4e4e7;
        font-size: 13px;
        color: #3f3f46;
        box-sizing: border-box;
    }

    .mode-selector label {
        display: flex;
        align-items: center;
        gap: 4px;
        cursor: pointer;
        font-weight: 600;
    }

    .mode-selector input[type="radio"] {
        cursor: pointer;
        accent-color: #27272a;
        margin: 0;
    }
        
    /* 좌우 이동 버튼 영역 */
    .controls {
        width: 100%;
        padding: 10px 15px; 
        display: flex;
        flex-direction: row; 
        justify-content: center;
        align-items: center;
        gap: 10px; 
        background-color: #f4f4f5;
        border-top: 1px solid #d4d4d8;
        box-sizing: border-box;
    }
        
    /* 좌/우 50% 크기의 버튼 스타일 */
    .controls .btn-img {
        flex: 1; 
        padding: 12px 0;
        font-size: 22px;
        font-weight: bold;
        color: #fff;
        background-color: #27272a;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        text-align: center;
        cursor: pointer;
        user-select: none;
    }
    
    .controls .btn-img:active {
        background-color: #3f3f46; /* 클릭 시 색상 변화 */
    }
</style>
</head>
<body>
        
    <!-- 만화 뷰어 영역 (스크롤은 여기서만 발생) -->
    <div class="viewer" id="mangaViewer">
        <div class="manga-page">
            <img src="1.png" alt="페이지 1">
        </div>
        <div class="manga-page">
            <img src="2.png" alt="페이지 2">
        </div>
        <div class="manga-page">
            <img src="3.png" alt="페이지 3">
        </div>
    </div>
    
    <!-- 하단 컨트롤 UI (항상 바닥에 고정) -->
    <div class="bottom-ui">
        <div class="mode-selector">
            <label><input type="radio" name="scrollStep" value="2"> 1/2 단위</label>
            <label><input type="radio" name="scrollStep" value="3" checked> 1/3 단위</label>
        </div>

        <div class="controls">
            <div class="btn-img" id="btnUp">∧</div>
            <div class="btn-img" id="btnDown">∨</div>
        </div>
    </div>
        
<script>
    function scrollManga(direction) {
        const viewer = document.getElementById('mangaViewer');
        const pages = viewer.querySelectorAll('.manga-page');
        
        const selectedMode = document.querySelector('input[name="scrollStep"]:checked')?.value || '3';
        const steps = parseInt(selectedMode, 10);

        const targetScrolls = [];
        
        pages.forEach((page) => {
            const pTop = page.offsetTop;
            const pHeight = page.offsetHeight;
            
            for (let i = 0; i < steps; i++) {
                targetScrolls.push(pTop + (pHeight * (i / steps)));
            }
        });

        const currentScroll = viewer.scrollTop;
        let closestIndex = 0;
        let minDiff = Infinity;

        targetScrolls.forEach((target, index) => {
            const diff = Math.abs(target - currentScroll);
            if (diff < minDiff) {
                minDiff = diff;
                closestIndex = index;
            }
        });

        const targetIndex = Math.max(0, Math.min(closestIndex + direction, targetScrolls.length - 1));
        viewer.scrollTo({ top: targetScrolls[targetIndex], behavior: 'smooth' });
    }

    // 하단 명시적 버튼 클릭 이벤트 추가
    document.getElementById('btnUp').addEventListener('click', () => scrollManga(-1));
    document.getElementById('btnDown').addEventListener('click', () => scrollManga(1));
     
    // 화면 클릭을 통한 스크롤 (하단 UI 제외)
    window.addEventListener('click', (e) => {
        if (e.target.closest('.bottom-ui')) {
            return; // 하단 UI 영역 클릭 시 무시
        }
     
        const isRightHalf = e.clientX > window.innerWidth / 2;
        const isBottomHalf = e.clientY > window.innerHeight / 2;
     
        if (isRightHalf && isBottomHalf) {
            scrollManga(1); 
        } else {
            scrollManga(-1);
        }
    });

    // 키보드 화살표 스크롤
    window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
            e.preventDefault();
            scrollManga(1);
        } else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
            e.preventDefault();
            scrollManga(-1);
        }
    });
</script>
        
</body>
</html>
