<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notion Manga Viewer</title>
<style>
    /* 전체 화면 여백 제거 및 배경 설정 (노션 임베드 시 꽉 차게) */
    body {
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        height: 100vh;
        background-color: #ffffff;
        font-family: 'Malgun Gothic', sans-serif;
        user-select: none; /* 연속 클릭 시 텍스트 드래그 방지 */
        overflow: hidden; /* ★ 수정: 브라우저 전체 스크롤 방지 */
    }
        
    /* 전체 컨테이너 */
    .viewer-wrapper {
        width: 100%;
        max-width: 800px; /* 뷰어 최대 너비 */
        height: 100%;
        display: flex;
        flex-direction: column;
        position: relative; /* ★ 수정: 하단 UI 겹치기를 위한 기준점 설정 */
    }
        
    /* 뷰어 영역 (이미지가 스크롤 되는 곳) */
    .viewer {
        flex-grow: 1; /* 남은 공간을 모두 차지 */
        overflow-y: auto;
        background-color: #1a1a1a; /* 만화 몰입도를 위한 어두운 배경 */
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-bottom: 100vh; /* 하단 스크롤 여백 */
        
        /* 스크롤바 숨기기 */
        -ms-overflow-style: none; /* IE, Edge */
        scrollbar-width: none; /* Firefox */
    }
    
    .viewer::-webkit-scrollbar {
        display: none; /* Chrome, Safari, Opera */
    }
        
    /* 만화 페이지 크기 및 비율 설정 */
    .manga-page {
        width: 100%;
        flex-shrink: 0;   /* 비율 왜곡 방지 */
        aspect-ratio: 1 / 1.414; /* 점프 만화 원고(B4) 비율 */
        display: flex;
        justify-content: center;
        align-items: center;
        border-bottom: 2px solid #000;
        box-sizing: border-box;

        /* 이미지 사이 간격 */
        margin-bottom: 20px;
    }

    /* 마지막 이미지 아래 간격 처리 */
    .manga-page:last-child {
        margin-bottom: 0;
    }
        
    /* 실제 만화 이미지 스타일 */
    .manga-page img {
        width: 100%;
        height: 100%;
        object-fit: contain; /* 이미지가 잘리지 않고 비율 유지 */
        background-color: #fff;
    }

    /* ★ 수정: 하단 UI들을 묶어서 뷰어 위에 띄우는 컨테이너 추가 */
    .bottom-ui {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        z-index: 10;
        /* 선택 사항: 배경에 투명도를 주고 싶다면 배경색에 rgba를 적용할 수 있습니다 */
    }

    /* 이동 단위 선택 바 (가늘고 깔끔하게 배치) */
    .mode-selector {
        width: 100%;
        padding: 6px 0;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 20px;
        background-color: #e4e4e7;
        border-top: 1px solid #d4d4d8;
        font-size: 12px;
        color: #3f3f46;
        box-sizing: border-box;
    }

    .mode-selector label {
        display: flex;
        align-items: center;
        gap: 4px;
        cursor: pointer;
        font-weight: 600;
    }

    .mode-selector input[type="radio"] {
        cursor: pointer;
        accent-color: #27272a;
        margin: 0;
    }
        
    /* 뷰어 밖 하단 컨트롤 영역 (가로 2분할 구조) */
    .controls {
        width: 100%;
        padding: 10px 15px; 
        display: flex;
        flex-direction: row; /* 좌/우 가로 배치 */
        justify-content: center;
        align-items: center;
        gap: 10px; 
        background-color: #f4f4f5;
        border-top: 1px solid #e4e4e7;
        box-sizing: border-box;
    }
        
    /* 좌/우 50% 크기의 표시 영역 */
    .controls .btn-img {
        flex: 1; /* 좌우 1:1 동일 비율 배치 */
        padding: 12px 0;
        font-size: 22px;
        font-weight: bold;
        color: #fff;
        background-color: #27272a;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        text-align: center;
        box-sizing: border-box;
    }
</style>
</head>
<body>
        
<div class="viewer-wrapper">
    <!-- 만화 뷰어 영역 -->
    <div class="viewer" id="mangaViewer">
        <div class="manga-page">
            <img src="1.png" alt="페이지 1">
        </div>
        <div class="manga-page">
            <img src="2.png" alt="페이지 2">
        </div>
        <div class="manga-page">
            <img src="3.png" alt="페이지 3">
        </div>
    </div>
    
    <!-- ★ 수정: 하단 컨트롤 UI를 .bottom-ui 래퍼로 묶어서 뷰어 위에 오버레이 시킴 -->
    <div class="bottom-ui">
        <!-- 이동 단위 선택 바 -->
        <div class="mode-selector">
            <label><input type="radio" name="scrollStep" value="2"> 1/2 단위</label>
            <label><input type="radio" name="scrollStep" value="3" checked> 1/3 단위</label>
        </div>

        <!-- 스케치 모양의 하단 가로 배치 컨트롤 표시 영역 -->
        <div class="controls">
            <div class="btn-img">∧</div>
            <div class="btn-img">∨</div>
        </div>
    </div>
</div>
        
<script>
    function scrollManga(direction) {
        const viewer = document.getElementById('mangaViewer');
        const pages = viewer.querySelectorAll('.manga-page');
        
        // 선택된 스크롤 단위 취득 (2: 1/2 단위, 3: 1/3 단위)
        const selectedMode = document.querySelector('input[name="scrollStep"]:checked')?.value || '3';
        const steps = parseInt(selectedMode, 10);

        // 각 이미지마다 설정된 단위로 끊어지는 스크롤 목표 좌표 배열 생성
        const targetScrolls = [];
        
        pages.forEach((page) => {
            const pTop = page.offsetTop;
            const pHeight = page.offsetHeight;
            
            for (let i = 0; i < steps; i++) {
                targetScrolls.push(pTop + (pHeight * (i / steps)));
            }
        });

        // 현재 스크롤 위치에서 가장 가까운 지점 도출
        const currentScroll = viewer.scrollTop;
        let closestIndex = 0;
        let minDiff = Infinity;

        targetScrolls.forEach((target, index) => {
            const diff = Math.abs(target - currentScroll);
            if (diff < minDiff) {
                minDiff = diff;
                closestIndex = index;
            }
        });

        // direction(-1: 이전, 1: 다음) 적용
        const targetIndex = Math.max(0, Math.min(closestIndex + direction, targetScrolls.length - 1));

        // 목표 지점으로 부드럽게 스크롤
        viewer.scrollTo({ top: targetScrolls[targetIndex], behavior: 'smooth' });
    }
     
    // 화면 터치/클릭 위치 판별 (우측 하단 1/4 = 다음, 그 외 = 이전)
    window.addEventListener('click', (e) => {
        // 하단 컨트롤 영역이나 이동 단위 선택 바를 클릭한 경우는 스크롤 동작 방지
        if (e.target.closest('.controls') || e.target.closest('.mode-selector')) {
            return;
        }
     
        const isRightHalf = e.clientX > window.innerWidth / 2;
        const isBottomHalf = e.clientY > window.innerHeight / 2;
     
        if (isRightHalf && isBottomHalf) {
            scrollManga(1);  // 우측 하단 1/4: 다음 (아래로)
        } else {
            scrollManga(-1); // 그 외 전체 영역: 이전 (위로)
        }
    });

    // 방향키(상/하/좌/우) 입력 처리
    window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
            e.preventDefault();
            scrollManga(1);
        } else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
            e.preventDefault();
            scrollManga(-1);
        }
    });
</script>
        
</body>
</html>
