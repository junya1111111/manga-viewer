<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notion Manga Viewer</title>
<style>
    /* html, body 높이를 100%로 고정하여 노션 임베드 블록 크기에 맞춤 */
    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        background-color: #ffffff;
        font-family: 'Malgun Gothic', sans-serif;
        user-select: none;
        overflow: hidden;
    }
        
    /* 전체 컨테이너: 높이 제한 제거 */
    .viewer-wrapper {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
    }
        
    /* 뷰어 영역: 노션 블록이 늘어나는 대로 가변 처리 */
    .viewer {
        flex: 1; /* flex-grow: 1 및 flex-shrink: 1 적용으로 높이 확장 제약 해제 */
        overflow-y: auto;
        background-color: #1a1a1a; 
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-bottom: 200px; /* ★ 100vh 삭제 -> 노션 PC 앱 뷰포트 높이 계산 오류 방지 */
        
        /* 스크롤바 숨기기 */
        -ms-overflow-style: none; /* IE, Edge */
        scrollbar-width: none; /* Firefox */
    }
    
    .viewer::-webkit-scrollbar {
        display: none; /* Chrome, Safari, Opera */
    }
        
    /* 만화 페이지 크기 및 비율 설정 */
    .manga-page {
        width: 100%;
        flex-shrink: 0;   
        aspect-ratio: 1 / 1.414; 
        display: flex;
        justify-content: center;
        align-items: center;
        border-bottom: 2px solid #000;
        box-sizing: border-box;
        margin-bottom: 20px;
    }
    .manga-page:last-child {
        margin-bottom: 0;
    }
        
    /* 실제 만화 이미지 스타일 */
    .manga-page img {
        width: 100%;
        height: 100%;
        object-fit: contain; 
        background-color: #fff;
    }

    /* 하단 UI 패널 */
    .bottom-ui {
        width: 100%;
        z-index: 10;
        flex-shrink: 0;
    }

    /* 이동 단위 선택 바 */
    .mode-selector {
        width: 100%;
        padding: 6px 0;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 20px;
        background-color: #e4e4e7;
        border-top: 1px solid #d4d4d8;
        font-size: 12px;
        color: #3f3f46;
        box-sizing: border-box;
    }
    .mode-selector label {
        display: flex;
        align-items: center;
        gap: 4px;
        cursor: pointer;
        font-weight: 600;
    }
    .mode-selector input[type="radio"] {
        cursor: pointer;
        accent-color: #27272a;
        margin: 0;
    }
        
    /* 뷰어 밖 하단 컨트롤 영역 */
    .controls {
        width: 100%;
        padding: 10px 15px; 
        display: flex;
        flex-direction: row; 
        justify-content: center;
        align-items: center;
        gap: 10px; 
        background-color: #f4f4f5;
        border-top: 1px solid #e4e4e7;
        box-sizing: border-box;
    }
        
    /* 좌/우 50% 크기의 표시 영역 */
    .controls .btn-img {
        flex: 1; 
        padding: 12px 0;
        font-size: 22px;
        font-weight: bold;
        color: #fff;
        background-color: #27272a;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        text-align: center;
        box-sizing: border-box;
        cursor: pointer;
    }
</style>
</head>
<body>
        
<div class="viewer-wrapper">
    <!-- 만화 뷰어 영역 -->
    <div class="viewer" id="mangaViewer">
        <div class="manga-page">
            <img src="1.png" alt="페이지 1">
        </div>
        <div class="manga-page">
            <img src="2.png" alt="페이지 2">
        </div>
        <div class="manga-page">
            <img src="3.png" alt="페이지 3">
        </div>
    </div>
    
    <!-- 하단 컨트롤 UI -->
    <div class="bottom-ui">
        <div class="mode-selector">
            <label><input type="radio" name="scrollStep" value="2"> 1/2 단위</label>
            <label><input type="radio" name="scrollStep" value="3" checked> 1/3 단위</label>
        </div>
        <div class="controls">
            <div class="btn-img" id="btnUp">∧</div>
            <div class="btn-img" id="btnDown">∨</div>
        </div>
    </div>
</div>
        
<script>
    function scrollManga(direction) {
        const viewer = document.getElementById('mangaViewer');
        const pages = viewer.querySelectorAll('.manga-page');
        
        const selectedMode = document.querySelector('input[name="scrollStep"]:checked')?.value || '3';
        const steps = parseInt(selectedMode, 10);
        const targetScrolls = [];
        
        pages.forEach((page) => {
            const pTop = page.offsetTop;
            const pHeight = page.offsetHeight;
            
            for (let i = 0; i < steps; i++) {
                targetScrolls.push(pTop + (pHeight * (i / steps)));
            }
        });
        const currentScroll = viewer.scrollTop;
        let closestIndex = 0;
        let minDiff = Infinity;
        targetScrolls.forEach((target, index) => {
            const diff = Math.abs(target - currentScroll);
            if (diff < minDiff) {
                minDiff = diff;
                closestIndex = index;
            }
        });
        const targetIndex = Math.max(0, Math.min(closestIndex + direction, targetScrolls.length - 1));
        viewer.scrollTo({ top: targetScrolls[targetIndex], behavior: 'smooth' });
    }
     
    window.addEventListener('click', (e) => {
        if (e.target.closest('#btnUp')) {
            scrollManga(-1);
            return;
        }
        if (e.target.closest('#btnDown')) {
            scrollManga(1);
            return;
        }
        if (e.target.closest('.controls') || e.target.closest('.mode-selector')) {
            return;
        }
     
        const isRightHalf = e.clientX > window.innerWidth / 2;
        const isBottomHalf = e.clientY > window.innerHeight / 2;
     
        if (isRightHalf && isBottomHalf) {
            scrollManga(1); 
        } else {
            scrollManga(-1);
        }
    });

    window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
            e.preventDefault();
            scrollManga(1);
        } else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
            e.preventDefault();
            scrollManga(-1);
        }
    });
</script>
        
</body>
</html>
