<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notion Manga Viewer</title>
<style>
    /* 1. 노션 임베드 영역 전체 활용 및 스크롤 방지 */
    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #1a1a1a;
        font-family: 'Malgun Gothic', -apple-system, sans-serif;
        user-select: none;
        overflow: hidden;
    }
        
    /* 2. 전체 레이아웃 */
    .viewer-wrapper {
        width: 100%;
        height: 100%;
        max-width: 800px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        box-sizing: border-box;
        background-color: #1a1a1a;
    }
        
    /* 3. 만화 뷰어 영역 */
    .viewer {
        flex: 1;
        min-height: 0;
        width: 100%;
        overflow-y: auto;
        overflow-x: hidden;
        position: relative;
        background-color: #1a1a1a;
        box-sizing: border-box;
        
        /* 스크롤바 숨기기 */
        -ms-overflow-style: none;
        scrollbar-width: none;
    }
    
    .viewer::-webkit-scrollbar {
        display: none;
    }
        
    /* 4. 만화 페이지: 뷰어 화면 높이(100%)에 맞춤 */
    .manga-page {
        width: 100%;
        height: 100%; /* 뷰어 영역 1페이지 전체 차지 */
        flex: 0 0 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        box-sizing: border-box;
    }
        
    /* 5. 이미지: 가로/세로 중 먼저 닿는 면에 맞추어 확대/축소 (전체 이미지 노출) */
    .manga-page img {
        width: 100%;
        height: 100%;
        object-fit: contain; /* 잘림 없이 한 화면에 전체 표시 */
        display: block;
    }

    /* 6. 하단 UI 영역 */
    .bottom-ui {
        flex-shrink: 0;
        width: 100%;
        background-color: #f4f4f5;
        border-top: 1px solid #d4d4d8;
        z-index: 10;
    }

    .mode-selector {
        width: 100%;
        padding: 6px 0;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 20px;
        background-color: #e4e4e7;
        border-bottom: 1px solid #d4d4d8;
        font-size: 12px;
        color: #3f3f46;
        box-sizing: border-box;
    }

    .mode-selector label {
        display: flex;
        align-items: center;
        gap: 4px;
        cursor: pointer;
        font-weight: 600;
    }

    .mode-selector input[type="radio"] {
        cursor: pointer;
        accent-color: #27272a;
        margin: 0;
    }
        
    .controls {
        width: 100%;
        padding: 8px 15px; 
        display: flex;
        flex-direction: row; 
        justify-content: center;
        align-items: center;
        gap: 10px; 
        box-sizing: border-box;
    }
        
    .controls .btn-img {
        flex: 1; 
        padding: 10px 0;
        font-size: 20px;
        font-weight: bold;
        color: #fff;
        background-color: #27272a;
        border-radius: 8px;
        text-align: center;
        box-sizing: border-box;
        cursor: pointer;
    }

    .controls .btn-img:active {
        background-color: #52525b;
    }
</style>
</head>
<body>
        
<div class="viewer-wrapper">
    <div class="viewer" id="mangaViewer">
        <div class="manga-page">
            <img src="1.png" alt="페이지 1">
        </div>
        <div class="manga-page">
            <img src="2.png" alt="페이지 2">
        </div>
        <div class="manga-page">
            <img src="3.png" alt="페이지 3">
        </div>
    </div>
    
    <div class="bottom-ui">
        <div class="mode-selector">
            <label><input type="radio" name="scrollStep" value="1"> 1 페이지 단위</label>
            <label><input type="radio" name="scrollStep" value="2"> 1/2 단위</label>
            <label><input type="radio" name="scrollStep" value="3" checked> 1/3 단위</label>
        </div>
        <div class="controls">
            <div class="btn-img" onclick="scrollManga(-1)">∧</div>
            <div class="btn-img" onclick="scrollManga(1)">∨</div>
        </div>
    </div>
</div>
        
<script>
    function scrollManga(direction) {
        const viewer = document.getElementById('mangaViewer');
        const pages = viewer.querySelectorAll('.manga-page');
        if (!pages.length) return;
        
        const selectedMode = document.querySelector('input[name="scrollStep"]:checked')?.value || '3';
        const steps = parseInt(selectedMode, 10);
        const targetScrolls = [];
        
        pages.forEach((page) => {
            const pTop = page.offsetTop;
            const pHeight = page.offsetHeight;
            
            for (let i = 0; i < steps; i++) {
                targetScrolls.push(pTop + (pHeight * (i / steps)));
            }
        });

        const maxScroll = viewer.scrollHeight - viewer.clientHeight;
        targetScrolls.push(maxScroll);

        const sortedTargets = [...new Set(targetScrolls.map(v => Math.round(v)))].sort((a, b) => a - b);
        const currentScroll = Math.round(viewer.scrollTop);

        let closestIndex = 0;
        let minDiff = Infinity;
        
        sortedTargets.forEach((target, index) => {
            const diff = Math.abs(target - currentScroll);
            if (diff < minDiff) {
                minDiff = diff;
                closestIndex = index;
            }
        });

        const targetIndex = Math.max(0, Math.min(closestIndex + direction, sortedTargets.length - 1));
        viewer.scrollTo({ top: sortedTargets[targetIndex], behavior: 'smooth' });
    }
     
    window.addEventListener('click', (e) => {
        if (e.target.closest('.bottom-ui')) return;
     
        const isRightHalf = e.clientX > window.innerWidth / 2;
        const isBottomHalf = e.clientY > window.innerHeight / 2;
     
        if (isRightHalf && isBottomHalf) {
            scrollManga(1); 
        } else {
            scrollManga(-1);
        }
    });

    window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
            e.preventDefault();
            scrollManga(1);
        } else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
            e.preventDefault();
            scrollManga(-1);
        }
    });
</script>
        
</body>
</html>
